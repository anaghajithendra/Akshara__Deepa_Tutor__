<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quiz Mode - Akshara-Deepa Tutor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c4c5d5",
                        "on-secondary-fixed-variant": "#005323",
                        "on-surface-variant": "#444653",
                        "on-primary-container": "#a8b8ff",
                        "secondary": "#006d30",
                        "surface-container-low": "#eff4ff",
                        "surface-variant": "#d3e4fe",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#89ceff",
                        "on-surface": "#0b1c30",
                        "primary-container": "#1e40af",
                        "tertiary": "#003853",
                        "secondary-fixed-dim": "#79db8d",
                        "primary-fixed": "#dde1ff",
                        "on-secondary-container": "#007233",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#b8c4ff",
                        "background": "#f8f9ff",
                        "inverse-primary": "#b8c4ff",
                        "surface": "#f8f9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "on-primary-fixed": "#001453",
                        "primary": "#00288e",
                        "surface-tint": "#3755c3",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#cbdbf5",
                        "inverse-surface": "#213145",
                        "surface-container": "#e5eeff",
                        "on-secondary-fixed": "#00210a",
                        "surface-container-highest": "#d3e4fe",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#c9e6ff",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#95f8a7",
                        "on-primary-fixed-variant": "#173bab",
                        "on-tertiary-fixed": "#001e2f",
                        "on-background": "#0b1c30",
                        "on-tertiary-container": "#68c4ff",
                        "secondary-container": "#92f5a4",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary-fixed-variant": "#004c6e",
                        "outline": "#757684",
                        "surface-container-high": "#dce9ff",
                        "tertiary-container": "#005074"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "12px",
                        "touch-target-min": "48px",
                        "margin-mobile": "20px",
                        "base": "8px",
                        "gutter-mobile": "16px",
                        "stack-lg": "40px",
                        "stack-md": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "label-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col pt-[48px] pb-[80px]">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest border-b border-outline-variant fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min">
<button class="flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 rounded-full p-2 transition-opacity duration-150 active:opacity-80">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex flex-col items-center">
<span class="font-label-lg text-label-lg text-on-surface-variant">Question 3 of 5</span>
<div class="flex items-center gap-1 text-error font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px]">timer</span>
<span>04:59 remaining</span>
</div>
</div>
<div class="w-8"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-margin-mobile pt-stack-md w-full max-w-2xl mx-auto">
<!-- Progress Bar -->
<div class="w-full mb-stack-md h-2 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-secondary w-3/5 rounded-full transition-all duration-300"></div>
</div>
<!-- Question Card -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-md mb-stack-lg flex flex-col gap-stack-sm shadow-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface text-center mb-base">What is the chemical formula for rust?</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Select the most accurate representation of hydrated iron(III) oxide.</p>
</div>
<!-- Answer Options (Bento-style Grid on Desktop, Stack on Mobile) -->
<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-stack-sm mb-stack-lg">
<!-- Option A (Unselected) -->
<label class="w-full min-h-touch-target-min flex items-center p-base border border-outline-variant rounded-lg bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors duration-200">
<input class="sr-only peer" name="quiz_answer" type="radio"/>
<div class="w-6 h-6 flex-shrink-0 rounded-full border-2 border-outline-variant peer-checked:border-secondary peer-checked:bg-secondary flex items-center justify-center mr-stack-sm">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface-variant mb-1">Option A</span>
<span class="font-body-lg text-body-lg text-on-surface">FeO</span>
</div>
</label>
<!-- Option B (Selected/Active State Example) -->
<label class="w-full min-h-touch-target-min flex items-center p-base border-2 border-primary rounded-lg bg-surface-container-low cursor-pointer transition-colors duration-200">
<input checked="" class="sr-only peer" name="quiz_answer" type="radio"/>
<div class="w-6 h-6 flex-shrink-0 rounded-full border-2 border-secondary bg-secondary flex items-center justify-center mr-stack-sm">
<span class="material-symbols-outlined text-white text-[16px]">check</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-primary mb-1">Option B</span>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Fe2O3·nH2O</span>
</div>
</label>
<!-- Option C (Unselected) -->
<label class="w-full min-h-touch-target-min flex items-center p-base border border-outline-variant rounded-lg bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors duration-200">
<input class="sr-only peer" name="quiz_answer" type="radio"/>
<div class="w-6 h-6 flex-shrink-0 rounded-full border-2 border-outline-variant peer-checked:border-secondary peer-checked:bg-secondary flex items-center justify-center mr-stack-sm">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface-variant mb-1">Option C</span>
<span class="font-body-lg text-body-lg text-on-surface">Fe3O4</span>
</div>
</label>
<!-- Option D (Unselected) -->
<label class="w-full min-h-touch-target-min flex items-center p-base border border-outline-variant rounded-lg bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors duration-200">
<input class="sr-only peer" name="quiz_answer" type="radio"/>
<div class="w-6 h-6 flex-shrink-0 rounded-full border-2 border-outline-variant peer-checked:border-secondary peer-checked:bg-secondary flex items-center justify-center mr-stack-sm">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface-variant mb-1">Option D</span>
<span class="font-body-lg text-body-lg text-on-surface">Fe(OH)3</span>
</div>
</label>
</div>
</main>
<!-- Bottom Actions / Footer -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant p-margin-mobile flex justify-between gap-stack-sm z-40">
<button class="h-touch-target-min px-stack-md rounded-lg border border-outline-variant text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-variant/50 transition-colors flex-1 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">arrow_back</span>
            Previous
        </button>
<button class="h-touch-target-min px-stack-md rounded-lg bg-primary text-on-primary font-label-lg text-label-lg hover:opacity-90 shadow-[0_4px_14px_0_rgba(0,40,142,0.1)] transition-all flex-[2] flex items-center justify-center gap-2">
            Next Question
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</body></html>
